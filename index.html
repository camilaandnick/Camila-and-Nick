<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Camila & Nick</title>
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Camila & Nick · 09.04.2027 · Mazatlán, Sinaloa, México">
<meta property="og:title" content="Camila & Nick · Save the date">
<meta property="og:description" content="09 · 04 · 2027 · Mazatlán, Sinaloa, México">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<style>
/* VOICE: quiet luxury — her stationery suite photographed as a flat-lay, bilingual, unhurried
   IDEA: the invitation arrives as a sealed olive envelope; inside, every card of her suite is laid on linen
   PICTURE: olive envelope + gold sprig seal on linen; ivory cards overlapping envelopes, an olive oval RSVP, a gold tassel
   COLOUR and TYPE: her olive, ivory paper, wax gold, natural linen; Pinyon Script, Cormorant small caps + italics
   LAYOUT: cover → save the date in its envelope → invitation on an open envelope → reception/details/gift → el gran día → RSVP → return */
:root{color-scheme:light;--olive:#69722c;--olive-d:#565d27;--ink:#3c3d33;--soft:#5e5f52;--gold:#b8955a;--ivory:#fbf9f4;--line:#e3ddcf}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:18px/1.55 "Cormorant Garamond",Georgia,serif;overflow-x:clip;background:#b7ac9d url(img/linen.jpg?v=5);background-size:360px}
body.locked{overflow:hidden;height:100vh}
img{display:block;max-width:100%}
button{font:inherit}
.script{font-family:"Pinyon Script",cursive;font-weight:400;color:var(--olive-d);line-height:1}
.caps{text-transform:uppercase;letter-spacing:.14em;font-weight:500;font-size:14px}
.it{font-style:italic;color:var(--soft)}
a{color:inherit}
a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;font:inherit!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.olivefill-unused{background:#93a246 url(img/linen.jpg?v=5);background-blend-mode:multiply;background-size:300px}

/* ── cover ── */
#cover{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#b7ac9d url(img/linen.jpg?v=5);background-size:360px;transition:opacity 1s ease,transform 1.2s ease}
#cover.out{opacity:0;transform:scale(1.04);pointer-events:none}
.cv{display:grid;justify-items:center;text-align:center;padding:24px;gap:4px}
.cv .cvnames{font-size:clamp(46px,10vw,74px);margin:4px 0 30px}
.env{position:relative;width:min(84vw,460px);aspect-ratio:1100/839;border:0;padding:0;background:none;cursor:pointer;perspective:1600px}
.env:focus{outline:none}.env:focus-visible{outline:2px solid var(--gold);outline-offset:8px}
.env>*{position:absolute;inset:0;pointer-events:none}
.e-back{background:url(img/env-olive.jpg?v=5) center/cover;filter:brightness(.8);border-radius:4px;box-shadow:0 30px 50px -20px rgba(40,35,20,.6),0 6px 14px rgba(0,0,0,.18)}
.e-card{z-index:1;inset:5% 7% 3%;background:var(--ivory);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding-top:7%;transition:transform 1.1s cubic-bezier(.2,.8,.2,1) .55s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.e-card .script{font-size:clamp(30px,6.5vw,44px)}
.e-card .caps,.e-card span{color:var(--olive-d)!important;text-decoration:none!important}
.e-pocket{z-index:2;background:url(img/env-closed.jpg?v=5) top/100% 100% no-repeat;clip-path:polygon(0 0,50% 65.4%,100% 0,100% 100%,0 100%);border-radius:4px}
.env>.e-flap{inset:auto;left:0;top:0;width:100%;height:65.4%;transform-origin:top;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.4,.1,.3,1),z-index 0s .45s;z-index:3}
.f-front,.f-back{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.f-front{background:url(img/env-closed.jpg?v=5) top/100% 152.9% no-repeat;clip-path:polygon(-1% 0,101% 0,101% 2%,50% 103%,-1% 2%)}
.f-back{background:url(img/env-liner.png?v=5) center/100% 100% no-repeat;transform:rotateX(180deg)}
.e-seal{inset:auto;left:50%;top:68.3%;width:15%;transform:translate(-50%,-50%);z-index:4;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));transition:opacity .35s,transform .5s}
.env.open .e-seal{opacity:0;transform:translate(-50%,-50%) scale(1.3)}
.env.open .e-flap{transform:rotateX(180deg);z-index:0}
.env.open .e-card{transform:translateY(-52%)}
.env:not(.open) .e-seal{animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.06)}}
.cv .tap{margin-top:30px;font-size:13px;letter-spacing:.24em}

/* ── her original invitation ── */
.pdf{position:relative;width:min(100%,640px);margin:0 auto;-webkit-mask:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent);mask:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}
.pdf img{display:block;width:100%;height:auto}
.hot{position:absolute;display:block;border-radius:8px;-webkit-tap-highlight-color:rgba(184,149,90,.25)}
.hot:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
footer{text-align:center;padding:10px 20px 70px}
.back{background:none;border:0;color:var(--ink);font-size:13px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;min-height:44px}
.reenv{position:fixed;top:14px;right:14px;z-index:30;width:48px;height:48px;border-radius:50%;border:1px solid rgba(86,93,39,.35);background:rgba(251,249,244,.92);color:var(--olive-d);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px -6px rgba(40,40,20,.4);opacity:0;pointer-events:none;transition:opacity .6s}
body.opened .reenv{opacity:1;pointer-events:auto}
.reenv svg{width:22px;height:22px}
@media(prefers-reduced-motion:reduce){.env:not(.open) .e-seal{animation:none!important}}
</style>
</head>
<body class="locked">

<div id="cover">
 <div class="cv">
  <div class="caps">The Beginning of Our Forever</div>
  <div class="it">El comienzo de nuestra historia</div>
  <div class="script cvnames">Camila &amp; Nick</div>
  <button class="env" id="env" aria-label="Abrir el sobre · Open the envelope">
   <div class="e-back"></div>
   <div class="e-card"><span class="script">Save the date</span><span class="caps" style="font-size:12px"><span>09</span> · <span>04</span> · <span>2027</span></span></div>
   <div class="e-pocket"></div>
   <div class="e-flap"><div class="f-front"></div><div class="f-back"></div></div>
   <img class="e-seal" src="img/seal.png?v=5" alt="">
  </button>
  <div class="tap caps">Toca para abrir · Tap to see inside</div>
 </div>
</div>

<button class="reenv" id="reenv" aria-label="Volver al sobre · Return to envelope"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 6.5 12 13l8.5-6.5"/></svg></button>

<main>
 <div class="pdf" id="pdf" aria-label="Invitación de Camila y Nick · Camila and Nick's invitation"></div>
 <footer><button class="back" id="back">‹ Volver al sobre · Return to envelope</button></footer>
</main>

<script>
{
// One entry per invitation version (Invitados 1, 2, …). Link a guest with ?invitados=2
const INV={"2": {"n": 8, "w": 1440, "h": 10297, "links": [{"x": 37.714, "y": 43.667, "w": 33.471, "h": 2.107, "uri": "https://maps.app.goo.gl/gSUrrUd9CPuR6mM3A", "label": "Ver ubicaci\u00f3n de la ceremonia \u00b7 Ceremony location"}, {"x": 11.194, "y": 79.533, "w": 28.391, "h": 2.865, "uri": "https://www.camilaandnick.com/registry", "label": "Sugerencia de regalo \u00b7 Gift suggestion"}, {"x": 13.845, "y": 70.021, "w": 37.487, "h": 4.215, "uri": "https://www.camilaandnick.com/", "label": "Ver p\u00e1gina \u00b7 Visit website"}, {"x": 16.118, "y": 89.382, "w": 29.115, "h": 5.616, "uri": "https://www.camilaandnick.com/rsvp", "label": "Confirma aqu\u00ed \u00b7 R.S.V.P. here"}, {"x": 61.064, "y": 68.073, "w": 23.777, "h": 1.975, "uri": "https://maps.app.goo.gl/jxMHLZ9EfkpKpbPw7", "label": "Ver ubicaci\u00f3n de la recepci\u00f3n \u00b7 Reception location"}]}};
const want=new URLSearchParams(location.search).get('invitados');
const key=INV[want]?want:Object.keys(INV)[0], v=INV[key];
const pdf=document.getElementById('pdf');
pdf.style.aspectRatio=v.w+'/'+v.h;
for(let i=0;i<v.n;i++){const im=document.createElement('img');im.src='img/inv/inv'+key+'-'+i+'.jpg?v=5';im.alt='';im.decoding='async';if(i>1)im.loading='lazy';pdf.appendChild(im)}
v.links.forEach(l=>{const a=document.createElement('a');a.className='hot';a.href=l.uri;a.setAttribute('aria-label',l.label);
 a.style.cssText='left:'+l.x+'%;top:'+l.y+'%;width:'+l.w+'%;height:'+l.h+'%';pdf.appendChild(a)});
pdf.firstChild&&(pdf.firstChild.alt='Invitación de Camila y Nick');

const body=document.body,cover=document.getElementById('cover'),env=document.getElementById('env');
env.addEventListener('click',()=>{
 if(env.classList.contains('open'))return;
 env.classList.add('open');
 setTimeout(()=>{cover.classList.add('out');body.classList.remove('locked');window.scrollTo(0,0);body.classList.add('opened')},1900);
});
const reclose=()=>{
 body.classList.remove('opened');body.classList.add('locked');
 const els=[env,...env.children];els.forEach(c=>c.style.transition='none');
 env.classList.remove('open');void env.offsetWidth;els.forEach(c=>c.style.transition='');
 cover.classList.remove('out');window.scrollTo(0,0);
};
document.getElementById('back').addEventListener('click',reclose);
document.getElementById('reenv').addEventListener('click',reclose);
}
</script>
</body>
</html>
